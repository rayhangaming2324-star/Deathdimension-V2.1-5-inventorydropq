
name: Build DeathDimension V2.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build DeathDimension
        run: mvn -B clean package

      - name: Upload DeathDimension JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathDimension-V2.1-1.21.11
          path: target/deathdimension-2.1.0.jar
          if-no-files-found: error
